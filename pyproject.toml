[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-backend"
version = "0.2.0"
description = "AIC backend data foundation"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "redis>=6.2,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=0.25,<2",
]

[tool.setuptools]
package-dir = {"" = "apps/backend/src"}

[tool.setuptools.packages.find]
where = ["apps/backend/src"]
include = ["aic_backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/backend/tests", "tests"]
