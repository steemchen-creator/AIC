[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-backend"
version = "0.2.0"
description = "AIC backend data foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "redis>=6.2,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = {"" = "apps/backend/src"}

[tool.setuptools.packages.find]
where = ["apps/backend/src"]
include = ["aic_backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/backend/tests", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["apps/backend/src/aic_backend"]
strict = true

[[tool.mypy.overrides]]
module = ["alembic", "celery"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = [
  "aic_backend.application.ports.persistence",
  "aic_backend.application.point_in_time",
  "aic_backend.application.ports.calendar",
  "aic_backend.application.ports.historical",
  "aic_backend.application.ports.corporate_actions",
  "aic_backend.application.ports.instruments",
  "aic_backend.application.use_cases.backfill_daily_bars",
  "aic_backend.application.use_cases.adjusted_daily_bars",
  "aic_backend.application.use_cases.corporate_actions",
  "aic_backend.application.use_cases.historical_daily_bars",
  "aic_backend.application.use_cases.instruments",
  "aic_backend.application.use_cases.ingest_daily_bars",
  "aic_backend.application.use_cases.persist_ingestion",
  "aic_backend.application.use_cases.point_in_time_market_data",
  "aic_backend.application.use_cases.trading_calendar",
  "aic_backend.data_foundation",
  "aic_backend.domain.market_data",
  "aic_backend.infrastructure.canonical_persistence",
  "aic_backend.infrastructure.historical_persistence",
  "aic_backend.infrastructure.calendar_persistence",
  "aic_backend.infrastructure.instrument_persistence",
  "aic_backend.infrastructure.corporate_action_persistence",
  "aic_backend.provider_runtime",
  "aic_backend.providers.tushare",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
