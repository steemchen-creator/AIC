name: AIC Development Orchestrator

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      command:
        description: Authenticated, allowlisted governance operation
        required: true
        type: choice
        options: [reconcile, initialize, register, event, attach-pr, review, ready, merge, closeout, memory-update]
      payload:
        description: Structured JSON data; never executable commands or policy
        type: string
        default: '{}'

permissions:
  contents: read

concurrency:
  group: aic-development-state
  cancel-in-progress: false

jobs:
  orchestrate:
    if: vars.AIC_PIPELINE_ENABLED == 'true'
    environment: aic-development-governance
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Check out trusted main only, never PR head with write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install trusted-main control plane
        run: python -m pip install .
      - name: Process bounded event and render status
        env:
          GH_TOKEN: ${{ secrets.AIC_GOVERNANCE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m aic_dev_governance run >> "$GITHUB_STEP_SUMMARY"
