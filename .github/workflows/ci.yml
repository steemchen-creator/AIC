name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance:
    name: Governance baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm CI foundation
        run: echo "Checkpoint 0 establishes the CI workflow structure; project checks will be added in later checkpoints."

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aic_test
          POSTGRES_USER: aic
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aic -d aic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend and test dependencies
        run: python -m pip install ".[test]"

      - name: Run backend tests
        env:
          AIC_ENVIRONMENT: testing
          AIC_DATABASE_URL: postgresql+asyncpg://aic:test-only-password@localhost:5432/aic_test
          AIC_CELERY_BROKER_URL: redis://localhost:6379/1
        run: |
          alembic upgrade head
          pytest --cov --cov-report=term-missing

      - name: Lint backend
        run: ruff check apps/backend/src apps/backend/tests

      - name: Type-check backend
        run: mypy

  desktop:
    name: Desktop build
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build desktop
        run: dotnet build apps/desktop/AIC.Desktop.csproj --configuration Release
