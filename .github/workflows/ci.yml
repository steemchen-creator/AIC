name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance:
    name: Governance baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Confirm CI foundation
        run: echo "Checkpoint 0 establishes the CI workflow structure; project checks will be added in later checkpoints."

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aic_test
          POSTGRES_USER: aic
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aic -d aic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend and test dependencies
        run: python -m pip install ".[test]"

      - name: Run backend tests
        env:
          AIC_ENVIRONMENT: testing
          AIC_DATABASE_URL: postgresql+asyncpg://aic:test-only-password@localhost:5432/aic_test
          AIC_CELERY_BROKER_URL: redis://localhost:6379/1
        run: |
          alembic upgrade head
          pytest --cov --cov-report=term-missing --cov-report=json:tmp/coverage.json

      - name: Enforce DEV-GOV-001 critical coverage targets
        run: python -c "from pathlib import Path; from aic_dev_governance.coverage_gate import verify_coverage; print(verify_coverage(Path('tmp/coverage.json')))"

      - name: Lint backend
        run: ruff check apps/backend/src apps/backend/tests

      - name: Type-check backend
        run: mypy

      - name: Upload exact HEAD coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: tmp/coverage.json

  development-governance:
    name: AIC Development Governance Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Verify exact HEAD artifact and governance state
        env:
          GH_TOKEN: ${{ github.token }}
          AIC_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m aic_dev_governance gate

      - name: Generate immutable review context evidence
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          AIC_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python -m aic_dev_governance context

      - name: Upload review context bound to exact HEAD
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: review-context-${{ github.event.pull_request.head.sha }}
          path: tmp/REVIEW_CONTEXT.json

  desktop:
    name: Desktop build
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build desktop
        run: dotnet build apps/desktop/AIC.Desktop.csproj --configuration Release
